name: bot
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
concurrency:
  group: bot
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run bot
        id: bot
        run: |
          set +e
          python -u token_bot.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          RUN_SECONDS: "21000"
      - name: Save subscribers
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add subs.json
          git diff --cached --quiet || (git commit -m "state" && git push)
      - name: Start next run
        if: steps.bot.outputs.code == '0' || steps.bot.outputs.code == '3'
        run: |
          sleep 5
          gh workflow run bot
        env:
          GH_TOKEN: ${{ github.token }}
